name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but let every run on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The ui story tests run in Playwright's headless Chromium. The browser is
      # cached per Playwright version; its system libraries come from apt.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./packages/ui/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @docs-rag-lab/ui exec playwright install --with-deps --only-shell chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @docs-rag-lab/ui exec playwright install-deps chromium
      # Prettier, then the em-dash check (tooling/repo-checks).
      - run: pnpm format:check
      # lint includes the dependency-cruiser boundary check (//#depcruise).
      - run: pnpm turbo run lint typecheck test
      # next build, on its own so it does not compete with the tests for the CPUs.
      # Bundling problems only show here.
      - run: pnpm turbo run build
